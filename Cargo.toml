[package]
name = "jerky"
version = "0.1.0"
edition = "2024"

[lib]
name = "jerky"
path = "src/lib.rs"

[[bin]]
name = "jerky"
path = "src/main.rs"

[dependencies]
base64 = "0.23.1"
clap = { version = "4.5.53", features = ["derive"] }
dirs = "7.0.0"
flate2 = "1.1.10"
globset = "0.4.20"
js-semver = "0.4.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
sha1 = "0.11.0"
sha2 = "0.11.0"
tar = "0.4.46"
thiserror = "2.0.20"
ureq = { version = "3.4.1", features = ["json"] }

[dev-dependencies]
assert_cmd = "2.1.1"
predicates = "3.1.3"
tempfile = "3.27.0"
tiny_http = "0.12.0"
